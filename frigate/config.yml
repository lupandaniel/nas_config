# Frigate pulls from the standalone go2rtc service (ports 8554/8555).
# UI: http://<nas-ip>:8971  (admin password is printed in `docker logs frigate` on first start)
# RTSP auth: compose maps GO2RTC_RTSP_* → FRIGATE_RTSP_* below.
# MQTT left disabled; enable when you add a broker for the Home Assistant integration.
#
# Object detection off (no detectors/models). Every cam still needs a `detect` role
# for live view / decode — Frigate will not work with `record` alone.
# pod / terasa: live view only (no record).

mqtt:
  enabled: false

detect:
  enabled: false
  fps: 1

birdseye:
  enabled: false

ffmpeg:
  # VAAPI was crashing ffmpeg (Failed to sync surface / hwdownload -5) → restart
  # loops leaked RAM (hundreds of PIDs). Software decode until GPU path is stable.
  output_args:
    # Cameras use pcm_alaw audio (not MP4-safe); copy video, transcode audio → AAC
    record: preset-record-generic-audio-aac

record:
  enabled: true
  continuous:
    days: 15
  motion:
    days: 15
  alerts:
    retain:
      days: 30
      mode: all
  detections:
    retain:
      days: 30
      mode: all

cameras:
  fata:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/fata
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record

  spate:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/spate
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record

  sopru:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/sopru
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record

  pod:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/pod
          input_args: preset-rtsp-restream
          roles:
            - detect
    record:
      enabled: false

  terasa:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/terasa
          input_args: preset-rtsp-restream
          roles:
            - detect
    record:
      enabled: false
