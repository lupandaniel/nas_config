# Frigate pulls from the standalone go2rtc service (ports 8554/8555).
# UI: http://<nas-ip>:8971  (admin password is printed in `docker logs frigate` on first start)
# RTSP auth: compose maps GO2RTC_RTSP_* → FRIGATE_RTSP_* below.
# MQTT left disabled; enable when you add a broker for the Home Assistant integration.

mqtt:
  enabled: false

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi

# Loop storage: keep all video for N days, then motion longer, then alerts/detections longest.
# Frigate also auto-deletes oldest segments if the disk is nearly full.
# Tune `continuous.days` to fit ${PRIMARY_PARTITION}/frigate/media (5 cams use a lot of space).
record:
  enabled: true
  continuous:
    days: 15
  motion:
    days: 15
  alerts:
    retain:
      days: 30
      mode: all
  detections:
    retain:
      days: 30
      mode: all

cameras:
  fata:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/fata
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      fps: 5

  spate:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/spate
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      fps: 5

  sopru:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/sopru
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      fps: 5

  pod:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/pod
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      fps: 5

  terasa:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@host.docker.internal:8554/terasa
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      fps: 5
