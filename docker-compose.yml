services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
      - PRIMARY_PARTITION=${PRIMARY_PARTITION}
      - SECONDARY_PARTITION=${SECONDARY_PARTITION}
    volumes:
      - ${PRIMARY_PARTITION}/plex/library:/config
      - ${SECONDARY_PARTITION}/plex_data/tv:/tv
      - ${SECONDARY_PARTITION}/plex_data/movies:/movies
      - ${SECONDARY_PARTITION}/plex_data/doc:/documentaries
      - ${PRIMARY_PARTITION}/plex/transcode:/transcode

  homeassistant:
    image: homeassistant/home-assistant:latest
    container_name: hass
    privileged: true
    volumes:
      - ${PRIMARY_PARTITION}/hass:/config
      - /dev/serial/by-id/:/dev/serial/by-id
    devices:
      - /dev/ttyACM0
    environment:
      - TZ=Europe/Athens
      - PRIMARY_PARTITION=${PRIMARY_PARTITION}
      - SECONDARY_PARTITION=${SECONDARY_PARTITION}
    network_mode: host
    restart: always

  go2rtc:
    image: alexxit/go2rtc
    container_name: go2rtc
    network_mode: host
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Europe/Athens
    volumes:
      - ./go2rtc:/config

  # NVR (object detect off); cameras from standalone go2rtc (do not map 8554/8555).
  # UI: http://<nas-ip>:8971
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 512mb
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${PRIMARY_PARTITION}/frigate:/config
      - ./frigate/config.yml:/config/config.yml
      # Recordings must live on primary (not nested under /config mount)
      - ${PRIMARY_PARTITION}/frigate/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 512000000
    ports:
      - "8971:8971"
    environment:
      TZ: Europe/Athens
      FRIGATE_RTSP_USER: ${GO2RTC_RTSP_USERNAME}
      FRIGATE_RTSP_PASSWORD: ${GO2RTC_RTSP_PASSWORD}
      LIBVA_DRIVER_NAME: iHD
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbit
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Athens
      - WEBUI_PORT=8080
      - PRIMARY_PARTITION=${PRIMARY_PARTITION}
      - SECONDARY_PARTITION=${SECONDARY_PARTITION}
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - ${PRIMARY_PARTITION}/qbt:/config
      - ${SECONDARY_PARTITION}/downloads:/downloads
      - ${SECONDARY_PARTITION}/plex_data/tv:/tv
      - ${SECONDARY_PARTITION}/plex_data/movies:/movies
      - ${SECONDARY_PARTITION}/plex_data/doc:/doc
    restart: always
    networks:
      - my-network

  nginx:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx
    restart: always
    network_mode: host
    environment:
      - PRIMARY_PARTITION=${PRIMARY_PARTITION}
      - SECONDARY_PARTITION=${SECONDARY_PARTITION}
    volumes:
      - ${PRIMARY_PARTITION}/nginx/data:/data
      - ${PRIMARY_PARTITION}/nginx/letsencrypt:/etc/letsencrypt

  openvpn:
    image: kylemanna/openvpn
    container_name: openvpn
    volumes:
#      - ${PRIMARY_PARTITION}/openvpn:/etc/openvpn
      - ovpn-data-nas:/etc/openvpn
    environment:
      - OVPN_DATA=${PRIMARY_PARTITION}/openvpn
    ports:
      - 1194:1194/udp
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: always
    networks:
      - my-network

  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CLI_ARGS=
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - PRIMARY_PARTITION=${PRIMARY_PARTITION}
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI_PASSWORD}
    volumes:
      - ${PRIMARY_PARTITION}/duplicati/config:/config
      - ${PRIMARY_PARTITION}:/source
    ports:
      - 8200:8200
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PRIMARY_PARTITION=${PRIMARY_PARTITION}
      - SECONDARY_PARTITION=${SECONDARY_PARTITION}
    volumes:
      - ${PRIMARY_PARTITION}/radarr/data:/config
      - ${SECONDARY_PARTITION}/plex_data/movies:/movies
      - ${SECONDARY_PARTITION}/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PRIMARY_PARTITION=${PRIMARY_PARTITION}
      - SECONDARY_PARTITION=${SECONDARY_PARTITION}
    volumes:
      - ${PRIMARY_PARTITION}/sonarr/data:/config
      - ${SECONDARY_PARTITION}/plex_data/tv:/tv
      - ${SECONDARY_PARTITION}/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Tashkent
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - ${PRIMARY_PARTITION}/seer:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    volumes:
      - ${PRIMARY_PARTITION}/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${PRIMARY_PARTITION}/${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      TZ: ${IMMICH_TZ:-Europe/Bucharest}
      DB_HOSTNAME: database
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME}
      REDIS_HOSTNAME: redis
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # ThinkCentre M920: Intel UHD → OpenVINO (set IMMICH_ML_HWACCEL in .env)
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-${IMMICH_ML_HWACCEL:-openvino}
    device_cgroup_rules:
      - 'c 189:* rmw'
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    environment:
      TZ: ${IMMICH_TZ:-Europe/Bucharest}
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: ${IMMICH_DB_STORAGE_TYPE:-HDD}
    volumes:
      - ${PRIMARY_PARTITION}/${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

networks:
  my-network:

volumes:
  ovpn-data-nas:
    external: true
  model-cache:
